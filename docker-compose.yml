# Local PostgreSQL for development and tests. Credentials are local-only defaults.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: car
      POSTGRES_PASSWORD: car
      POSTGRES_DB: car_dev
    ports:
      - '54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U car -d car_dev']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
